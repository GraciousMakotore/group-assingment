<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catalog — Le_gendary supplies</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* small page-specific styles */
    .controls { display:flex;gap:12px;flex-wrap:wrap;margin:18px 0;align-items:center; }
    .controls input[type="search"], .controls select { padding:8px 10px;border-radius:6px;border:1px solid #ccc; }
    .card-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:12px; }
    .card { background:#fff;border:1px solid #e6e6e6;padding:12px;border-radius:8px;box-shadow:0 6px 18px rgba(15,23,42,0.04); }
    .card img { width:100%;height:140px;object-fit:cover;border-radius:6px;margin-bottom:8px; }
    .card h3 { margin:6px 0;font-size:1.05rem; }
    .card p { margin:6px 0;color:#475569;font-size:.95rem; }
    .meta { display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px; }
    .price { font-weight:700;color:#0b5; }
    .btn { display:inline-block;padding:8px 12px;border-radius:6px;background:#2b6cb0;color:#fff;text-decoration:none;border:none;cursor:pointer; }
    .btn.outline { background:transparent;border:1px solid #2b6cb0;color:#2b6cb0; }
    .modal { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;padding:18px;z-index:60; }
    .modal.open { display:flex; }
    .modal-content { background:#fff;padding:18px;border-radius:8px;max-width:760px;width:100%;max-height:90vh;overflow:auto; }
    .modal-content img { width:100%;max-height:240px;object-fit:cover;border-radius:6px;margin-bottom:10px; }
    .filters-info { color:#334155;font-size:.95rem;margin-left:6px; }

    /* Debug / fallback overrides to ensure cards are visible even if global CSS hides them */
    #products { display:grid!important; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)) !important; gap:16px !important; }
    .card { display:block !important; color:#0b1726 !important; background:#fff !important; border:1px solid #cbd5e1 !important; box-shadow: 0 4px 12px rgba(2,6,23,0.06) !important; }
    .card h3, .card p, .meta { color: inherit !important; }
    .card img { display:block !important; max-height:180px !important; }
    @media (max-width:600px){ .card img{height:110px} .controls{flex-direction:column;align-items:stretch} }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">Le_gendary supplies</div>
    <button class="menu-btn" aria-label="Open menu" type="button">☰</button>
    <ul class="nav-links" style="display:flex;gap:16px;align-items:center;list-style:none;margin:0;padding:0;">
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog.html">Products</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button id="theme-toggle" aria-label="Toggle theme" type="button">🌙</button>
  </header>

  <main class="container" style="margin-top:28px;">
    <h1 class="section-title">Product Catalog</h1>

    <div class="controls" role="region" aria-label="Catalog controls">
      <input id="search" type="search" placeholder="Search products, codes or features" />
      <select id="category">
        <option value="all">All categories</option>
        <option value="patient-care">Patient Care & Monitoring</option>
        <option value="diagnostics">Diagnostic Equipment</option>
        <option value="lab-instruments">Laboratory Instruments</option>
        <option value="consumables">Consumables & PPE</option>
      </select>

      <select id="sort">
        <option value="featured">Sort: Featured</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
        <option value="name-asc">Name: A → Z</option>
      </select>

      <div style="margin-left:auto;display:flex;align-items:center;">
        <a class="btn outline" href="contact.html" id="bulk-quote">Request Bulk Quote</a>
      </div>
    </div>

    <div id="results-info" class="filters-info">Showing all products</div>

    <section id="products" class="card-grid" aria-live="polite">
      <!-- product cards rendered here by script -->
    </section>
  </main>

  <footer class="footer" style="margin-top:28px;">
    <p>&copy; 2025 Le_gendary supplies. All rights reserved.</p>
  </footer>

  <!-- product detail modal -->
  <div id="product-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <button id="modal-close" class="btn outline" style="float:right;">Close</button>
      <h2 id="modal-title">Product</h2>
      <img id="modal-img" src="" alt="">
      <p id="modal-desc"></p>
      <ul id="modal-specs"></ul>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <div class="price" id="modal-price"></div>
        <a id="quote-link" class="btn" href="#">Request Quote</a>
        <a id="more-info" class="btn outline" href="contact.html">Contact Sales</a>
      </div>
    </div>
  </div>

  <script>
    // sample product data - expand as needed
    const PRODUCTS = [
      {
        id: 'P001',
        category: 'patient-care',
        name: 'Multiparameter Monitor X5',
        short: 'ECG, SpO₂, NIBP, temp — compact bedside monitor',
        price: 1200,
        image: 'mc_monitor.jpg',
        specs: ['ECG 3/5 lead', 'SpO₂ accuracy ±2%', 'NIBP cuff sizes included', '2-year warranty'],
        availability: 'In stock'
      },
      {
        id: 'P002',
        category: 'patient-care',
        name: 'Volumetric Infusion Pump V200',
        short: 'Precision infusion with safety alarms',
        price: 450,
        image: 'mc_infusion.jpg',
        specs: ['Flow range 0.1-1200 mL/h', 'Battery backup 8hrs', 'Drug library optional'],
        availability: 'In stock'
      },
      {
        id: 'P010',
        category: 'diagnostics',
        name: 'Portable Ultrasound U-Scan Lite',
        short: 'Point-of-care imaging, tablet interface',
        price: 4200,
        image: 'mc_ultrasound.jpg',
        specs: ['Convex and linear probes', 'DICOM export', '1-year warranty'],
        availability: '7-14 day lead time'
      },
      {
        id: 'L001',
        category: 'lab-instruments',
        name: 'Benchtop Centrifuge C100',
        short: 'Maximum 4,000 RPM, multiple rotors',
        price: 300,
        image: 'mc_centrifuge.jpg',
        specs: ['Timer 1-60 min', 'Refrigeration optional', 'CE certified'],
        availability: 'In stock'
      },
      {
        id: 'C001',
        category: 'consumables',
        name: 'Diagnostic Test Kits — assorted',
        short: 'Rapid test kits, reagents and consumables (bulk pricing)',
        price: null,
        image: 'mc_consumables.jpg',
        specs: ['OEM reagents', 'Stability and storage details supplied on request'],
        availability: 'Contact for pricing'
      }
    ];

    // helpers
    const $ = sel => document.querySelector(sel);
    const $all = sel => Array.from(document.querySelectorAll(sel));

    // add debug logging to confirm rendering flow
    function debugLog(...args){ if (window.console) console.log('[CATALOG]', ...args); }

    function formatPrice(v) {
      if (v === null || v === undefined) return 'Contact for pricing';
      return 'USD ' + Number(v).toLocaleString();
    }

    // render cards
    function renderProducts(list) {
      debugLog('renderProducts called with', list.length, 'items');
      const container = $('#products');
      if (!container) { debugLog('No #products container found'); return; }
      container.innerHTML = '';
      if (!list.length) {
        container.innerHTML = '<p style="grid-column:1/-1;color:#64748b;">No products match your filters.</p>';
        $('#results-info').textContent = 'No products found';
        return;
      }
      $('#results-info').textContent = `Showing ${list.length} product${list.length>1?'s':''}`;
      list.forEach(p => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <img src="${p.image}" alt="${p.name}" onerror="this.onerror=null;this.src='placeholder.jpg'">
          <h3>${p.name}</h3>
          <p>${p.short}</p>
          <div class="meta">
            <div class="price">${formatPrice(p.price)}</div>
            <div>
              <button class="btn view" data-id="${p.id}">Details</button>
              <a class="btn outline" href="contact.html?product=${encodeURIComponent(p.name)}&id=${p.id}">Request Quote</a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      // quick visual check: add temporary border if needed
      $all('.card').forEach((c,i)=> c.style.outline = '1px solid rgba(0,0,0,0.04)');

      // attach detail handlers
      $all('.btn.view').forEach(b => b.addEventListener('click', e => openModal(e.currentTarget.dataset.id)));
    }

    function openModal(id) {
      const p = PRODUCTS.find(x => x.id === id);
      if (!p) return;
      $('#modal-title').textContent = `${p.name} — ${p.id}`;
      $('#modal-img').src = p.image;
      $('#modal-img').alt = p.name;
      $('#modal-img').onerror = function(){ this.src = 'placeholder.jpg'; };
      $('#modal-desc').textContent = p.short + ' • ' + p.availability;
      const ul = $('#modal-specs');
      ul.innerHTML = '';
      p.specs.forEach(s => { const li = document.createElement('li'); li.textContent = s; ul.appendChild(li); });
      $('#modal-price').textContent = formatPrice(p.price);
      $('#quote-link').href = `contact.html?product=${encodeURIComponent(p.name)}&id=${p.id}`;
      $('#product-modal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      $('#product-modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    // filtering, searching, sorting
    function applyFilters() {
      try {
        const q = $('#search').value.trim().toLowerCase();
        const cat = $('#category').value;
        const sort = $('#sort').value;
        let list = PRODUCTS.slice();

        if (cat !== 'all') list = list.filter(p => p.category === cat);
        if (q) list = list.filter(p => (p.name + ' ' + p.short + ' ' + (p.specs||[]).join(' ')).toLowerCase().includes(q) || p.id.toLowerCase().includes(q));

        if (sort === 'price-asc') list.sort((a,b) => (a.price||Infinity) - (b.price||Infinity));
        else if (sort === 'price-desc') list.sort((a,b) => (b.price||0) - (a.price||0));
        else if (sort === 'name-asc') list.sort((a,b) => a.name.localeCompare(b.name));
        // featured default keeps original order

        renderProducts(list);
      } catch (err) {
        console.error('Filter error', err);
        $('#results-info').textContent = 'Error applying filters (see console)';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        // initial render
        renderProducts(PRODUCTS);

        // controls
        const searchEl = $('#search');
        if (searchEl) searchEl.addEventListener('input', applyFilters);
        const catEl = $('#category');
        if (catEl) catEl.addEventListener('change', applyFilters);
        const sortEl = $('#sort');
        if (sortEl) sortEl.addEventListener('change', applyFilters);

        // modal handlers
        const modalClose = $('#modal-close');
        if (modalClose) modalClose.addEventListener('click', closeModal);
        $('#product-modal').addEventListener('click', (e) => {
          if (e.target === $('#product-modal')) closeModal();
        });

        // header fallback
        const menuBtn = document.querySelector('.menu-btn');
        const nav = document.querySelector('.nav-links');
        if (menuBtn && nav) menuBtn.addEventListener('click', () => nav.style.display = (nav.style.display === 'flex') ? 'none' : 'flex');

        // theme toggle (fallback)
        const themeBtn = document.getElementById('theme-toggle');
        if (themeBtn) themeBtn.addEventListener('click', () => {
          document.documentElement.classList.toggle('dark');
          themeBtn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        });

        // deep-link from other pages (preselect category or product)
        const params = new URLSearchParams(location.search);
        const productParam = params.get('product');
        const catParam = params.get('category');
        if (catParam) { $('#category').value = catParam; applyFilters(); }
        if (productParam) {
          const found = PRODUCTS.find(p => p.name === productParam || p.id === productParam);
          if (found) openModal(found.id);
        }
      } catch (err) {
        console.error('Init error', err);
        $('#results-info').textContent = 'Initialization error (see console)';
      }
    });
  </script>
</body>
</html>
